# Every merge into main gets a tag: nomadqa-v<version in extension/manifest.json>-build.<n>
# (a build tag only: no GitHub Release is made from it; releases come from a plain version tag, see release.yml).
name: tag
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tag
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag this commit
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          tag="nomadqa-v${version}-build.${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "NomadQA ${version}, build ${GITHUB_RUN_NUMBER} ($(git rev-parse --short HEAD))"
          git push origin "$tag"
          echo "Tagged \`$tag\` ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
